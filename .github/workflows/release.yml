name: Windows release
on:
  push:
    # Every tag runs, so a misnamed tag fails visibly instead of being ignored.
    tags: ['*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
      - run: npm ci
      - run: npm run version:app -- --check
      - run: npm run check
      - run: npm test
      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Configurez le secret TAURI_SIGNING_PRIVATE_KEY avant de publier une mise à jour.' }
      - run: npm run build:windows -- --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            $installerHash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($installerHash.Hash.ToLower())  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DropMeme-Windows-x64
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/desktop/src-tauri/target/release/bundle/nsis/*.sha256
            packages/desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: DropMeme-Windows-x64
          path: installers
      - name: Generate signed update manifest
        run: node scripts/release-manifest.mjs installers
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release created in the GitHub UI already owns the tag: attach the files to it.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "DropMeme $GITHUB_REF_NAME"
          fi
