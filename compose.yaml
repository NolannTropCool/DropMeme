services:
  server:
    build: .
    restart: unless-stopped
    init: true
    env_file: ${DROPMEME_ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /data/dropmeme.sqlite
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      - dropmeme_data:/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Définissez DOMAIN dans .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  dropmeme_data:
  caddy_data:
  caddy_config:
